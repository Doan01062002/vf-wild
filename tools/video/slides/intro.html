<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Mở đầu</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:"Segoe UI","Be Vietnam Pro",system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#06402a 0%,#0a7a4e 55%,#12a06a 100%);display:flex;align-items:center;justify-content:center;position:relative}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%);right:-180px;top:-220px}
.card{position:relative;text-align:center;padding:0 80px}
.logo{display:inline-block;background:#fff;border-radius:16px;padding:14px 26px;margin-bottom:34px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.logo img{height:72px;display:block}
h1{font-size:62px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
h1 em{font-style:normal;color:#ffe08a}
p{margin-top:22px;font-size:27px;opacity:.92;line-height:1.5}
.chips{margin-top:38px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:10px 22px;font-size:21px;font-weight:600}
</style></head><body><div class="glow"></div>
<div class="card">
  <div class="logo"><img src="http://127.0.0.1:8090/img/logo-chungauto.jpg" alt="ChungAuto"></div>
  <h1>Hướng dẫn sử dụng<br><em>trang quản trị vfwild.vn</em></h1>
  <p>Từ đăng nhập, viết bài đến tự động viết bài bằng Google Sheet</p>
  <div class="chips"><span>Viết &amp; sửa bài</span><span>Thư viện ảnh</span><span>Google Sheet</span><span>Kiểm tra nội dung</span></div>
</div>
</body></html>
