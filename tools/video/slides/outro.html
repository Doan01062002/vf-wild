<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Kết</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:"Segoe UI","Be Vietnam Pro",system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#06402a 0%,#0a7a4e 55%,#12a06a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
h1{font-size:54px;font-weight:800}
.row{display:flex;gap:26px}
.c{width:340px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:30px 26px;text-align:center}
.c b{display:block;font-size:30px;margin-bottom:12px;color:#ffe08a}
.c span{font-size:23px;line-height:1.5;opacity:.95}
.ty{font-size:28px;opacity:.9}
</style></head><body>
<h1>Tóm tắt cách làm việc hằng ngày</h1>
<div class="row">
  <div class="c"><b>Viết tay</b><span>Mục <u>Bài viết</u> → Viết bài mới → Đăng</span></div>
  <div class="c"><b>Tự động</b><span>Điền <u>Google Sheet</u>, ghi ngày giờ, đổi Trạng thái sang <u>Sẵn sàng</u></span></div>
  <div class="c"><b>Kiểm tra</b><span>Xem điểm ở <u>Kiểm tra nội dung</u> và sửa những chỗ được gợi ý</span></div>
</div>
<div class="ty">Cảm ơn bạn đã xem!</div>
</body></html>
